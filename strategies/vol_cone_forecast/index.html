<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Volatility-Cone Forecaster</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14161a;--muted:#6b7280;--line:#e5e7eb;--good:#15803d;--bad:#b91c1c;--accent:#4f46e5;--accent-soft:#eef2ff;--warn:#b45309}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
header h1{font-size:22px;margin:0 0 2px;font-weight:650;letter-spacing:-.01em}
header .sub{color:var(--muted);font-size:13px}
nav.top{font-size:12px;color:var(--muted);margin-bottom:14px}
nav.top a{color:var(--accent);text-decoration:none}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:18px 0 10px}
.row .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pills{display:inline-flex;background:#e9eaee;border-radius:8px;padding:3px}
.pills button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer;color:var(--muted)}
.pills button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.scenario-note{font-size:12px;color:var(--muted)}
.verdict{margin:12px 0 16px;font-size:13px;font-weight:600}
.verdict.good{color:var(--good)}.verdict.bad{color:var(--bad)}.verdict.neutral{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:88px}
.tile .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.tile .v{font-size:21px;font-weight:650;letter-spacing:-.01em}
.tile .s{font-size:11.5px;color:var(--muted);margin-top:4px}
.tile.good .v{color:var(--good)}.tile.bad .v{color:var(--bad)}.tile.warn .v{color:var(--warn)}
h2{font-size:15px;margin:30px 0 10px;font-weight:650}
h3{font-size:13.5px;margin:18px 0 6px;font-weight:650}
.chart{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px 6px;margin:12px 0}
.chart .t{font-size:12.5px;font-weight:600;margin-bottom:2px}
.chart .u{font-size:11px;color:var(--muted);margin-bottom:6px}
.chart svg{width:100%;height:230px;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:4px 0 6px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.prose{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:12px 0}
.prose p{margin:6px 0}
.prose ul{margin:6px 0 6px 18px;padding:0}
.prose li{margin:3px 0}
.prose table{border-collapse:collapse;width:100%;font-size:12.5px;margin:8px 0}
.prose th,.prose td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.prose th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.prose code,.tile code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:#f1f2f4;padding:1px 4px;border-radius:4px}
.prose pre{background:#f1f2f4;padding:10px 12px;border-radius:8px;overflow:auto;font:12px ui-monospace,Menlo,monospace}
.notes{font-size:12.5px;color:var(--muted)}
.notes li{margin:3px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
footer{margin-top:40px;font-size:11.5px;color:var(--muted)}
.tooltip{position:fixed;pointer-events:none;background:#14161a;color:#fff;font-size:11px;padding:4px 7px;border-radius:5px;display:none;z-index:9}
</style>
</head>
<body>
<div class="wrap">
<nav class="top"><a href="../../pages/index.html">← Portfolio index</a></nav>
<header><h1 id="title"></h1><div class="sub" id="subtitle"></div></header>
<div class="row" id="scenario-row"><span class="lbl">Scenario</span><div class="pills" id="pills"></div><span class="scenario-note" id="scn-note"></span></div>
<div class="verdict" id="verdict"></div>
<div class="tiles" id="tiles"></div>
<div id="charts"></div>
<div id="tables"></div>
<ul class="notes" id="notes"></ul>
<div id="sections"></div>
<footer id="footer"></footer>
</div>
<div class="tooltip" id="tt"></div>
<script>
const R = {"title": "Daily Volatility-Cone Forecaster", "subtitle": "Lognormal 1-day / 30-day bands from implied or realised vol \u00b7 risk-desk sizing input", "scenarios": {"sample": {"label": "Forecast 2026-10-22", "note": "sample output bundled in data/; --live refreshes from Deribit", "verdict": "BTC 30-day 90% cone: $67,585 \u2013 $96,908 at \u03c3 38.2% implied", "verdict_tone": "neutral", "tiles": [{"label": "BTC spot", "value": "$81,416", "sub": "\u03c3 38.2% \u00b7 Deribit DVOL (30d implied)", "tone": "neutral"}, {"label": "BTC 30d 90% range", "value": "$67,585 \u2013 $96,908", "sub": "1d 90%: 78,766\u201384,122", "tone": "neutral"}, {"label": "ETH spot", "value": "$2,384", "sub": "\u03c3 52.5% \u00b7 Deribit DVOL (30d implied)", "tone": "neutral"}, {"label": "ETH 30d 90% range", "value": "$1,840 \u2013 $3,019", "sub": "1d 90%: 2,278\u20132,493", "tone": "neutral"}, {"label": "SOL spot", "value": "$103.57", "sub": "\u03c3 41.0% \u00b7 Realized vol (30d daily, annualized)", "tone": "neutral"}, {"label": "SOL 30d 90% range", "value": "$84.76 \u2013 $124.82", "sub": "1d 90%: 99.96\u2013107.28", "tone": "neutral"}, {"label": "HYPE spot", "value": "$77.52", "sub": "\u03c3 51.5% \u00b7 Realized vol (30d daily, annualized)", "tone": "neutral"}, {"label": "HYPE 30d 90% range", "value": "$60.15 \u2013 $97.74", "sub": "1d 90%: 74.13\u201381.00", "tone": "neutral"}], "series": [{"label": "BTC 30-day lognormal cone, 90% band ($)", "x": ["d+0", "d+1", "d+2", "d+3", "d+4", "d+5", "d+6", "d+7", "d+8", "d+9", "d+10", "d+11", "d+12", "d+13", "d+14", "d+15", "d+16", "d+17", "d+18", "d+19", "d+20", "d+21", "d+22", "d+23", "d+24", "d+25", "d+26", "d+27", "d+28", "d+29", "d+30"], "y": {"low": [81416.12, 78765.51239, 77683.93068, 76860.50832, 76170.72429, 75566.3454, 75022.63423, 74524.89533, 74063.5536, 73631.95805, 73225.26602, 72839.82163, 72472.78457, 72121.89604, 71785.3246, 71461.56083, 71149.34325, 70847.6048, 70555.43327, 70272.04159, 69996.74503, 69728.94345, 69468.10741, 69213.767, 68965.50285, 68722.93888, 68485.73625, 68253.58842, 68026.21696, 67803.36812, 67584.80982], "median": [81416.12, 81399.83836, 81383.55997, 81367.28484, 81351.01297, 81334.74435, 81318.47898, 81302.21686, 81285.958, 81269.70239, 81253.45003, 81237.20092, 81220.95506, 81204.71244, 81188.47308, 81172.23696, 81156.00409, 81139.77447, 81123.54809, 81107.32496, 81091.10507, 81074.88843, 81058.67502, 81042.46486, 81026.25795, 81010.05427, 80993.85383, 80977.65664, 80961.46268, 80945.27196, 80929.08448], "high": [81416.12, 84122.26981, 85259.38088, 86138.31977, 86883.60748, 87543.47723, 88142.66643, 88695.87053, 89212.66462, 89699.69971, 90161.81845, 90602.67674, 91025.11487, 91431.39164, 91823.33851, 92202.46489, 92570.03226, 92927.10769, 93274.60338, 93613.30641, 93943.90152, 94266.98883, 94583.09779, 94892.69832, 95196.20978, 95494.00825, 95786.43259, 96073.78933, 96356.35689, 96634.38904, 96908.11785]}, "kind": "line", "unit": "$"}], "tables": [{"title": "All assets", "md": "| asset | spot | \u03c3 (ann.) | 1d 90% | 30d 68% | 30d 90% | 30d 95% | 30d median |\n|---|---|---|---|---|---|---|---|\n| BTC | 81,416 | 38.2% | 78,766\u201384,122 | 72,532\u201390,298 | 67,585\u201396,908 | 65,292\u2013100,312 | 80,929 |\n| ETH | 2,384 | 52.5% | 2,278\u20132,493 | 2,028\u20132,740 | 1,840\u20133,019 | 1,755\u20133,166 | 2,357 |\n| SOL | 103.57 | 41.0% | 99.96\u2013107.28 | 91.44\u2013115.70 | 84.76\u2013124.82 | 81.68\u2013129.54 | 102.86 |\n| HYPE | 77.52 | 51.5% | 74.13\u201381.00 | 66.16\u201388.87 | 60.15\u201397.74 | 57.42\u2013102.39 | 76.68 |\n"}], "notes": ["Used as the daily reserve-sizing input: perp margin reserves in the funding-carry cluster were set so the 30-day 95% high stayed below 0.8 \u00d7 the short's liquidation price."]}}, "default_scenario": "sample", "sections": [{"heading": "Method", "body_md": "```\nS_T = S_0 \u00b7 exp((\u03bc \u2212 \u03c3\u00b2/2)\u00b7T \u00b1 z\u00b7\u03c3\u00b7\u221aT),   z = 1.00 / 1.645 / 1.96\n\u03c3 = Deribit DVOL (BTC, ETH) or 30d realised daily vol annualised (SOL, HYPE)\n\u03bc = 0, or a damped external 24h prediction: \u03bc = clip(0.25 \u00d7 365 \u00d7 r_24h, \u00b140%/yr)\n```\nNo claim of edge: it is a calibrated-vol cone to size margin, reserves and liquidation guards consistently across the desk, refreshed daily and archived (260 daily runs Jun\u2013Oct 2026)."}, {"heading": "Reproduce", "body_md": "```\npython -m strategies.vol_cone_forecast.forecast\npython -m strategies.vol_cone_forecast.forecast --live\n```"}], "generated": "2026-10-23"};
const COLORS=['#4f46e5','#0f766e','#b45309','#be185d','#475569','#0369a1','#65a30d'];
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')}
function md(src){
  const lines=src.split('\n');let out='',i=0;
  while(i<lines.length){
    const l=lines[i];
    if(l.startsWith('```')){let b='';i++;while(i<lines.length&&!lines[i].startsWith('```')){b+=lines[i]+'\n';i++}i++;out+='<pre>'+esc(b)+'</pre>';continue}
    if(l.startsWith('### ')){out+='<h3>'+inline(l.slice(4))+'</h3>';i++;continue}
    if(l.startsWith('## ')){out+='<h3>'+inline(l.slice(3))+'</h3>';i++;continue}
    if(l.startsWith('|')){let rows=[];while(i<lines.length&&lines[i].startsWith('|')){rows.push(lines[i]);i++}
      rows=rows.filter(r=>!/^\|\s*-/.test(r));out+='<table>'+rows.map((r,k)=>'<tr>'+r.split('|').slice(1,-1).map(c=>(k?'<td>':'<th>')+inline(c.trim())+(k?'</td>':'</th>')).join('')+'</tr>').join('')+'</table>';continue}
    if(/^\s*- /.test(l)){out+='<ul>';while(i<lines.length&&/^\s*- /.test(lines[i])){out+='<li>'+inline(lines[i].replace(/^\s*- /,''))+'</li>';i++}out+='</ul>';continue}
    if(l.trim()===''){i++;continue}
    let p=l;i++;while(i<lines.length&&lines[i].trim()!==''&&!/^(#|\||```|\s*- )/.test(lines[i])){p+=' '+lines[i];i++}
    out+='<p>'+inline(p)+'</p>';
  }
  return out;
}
function fmtNum(v,unit){
  if(v==null)return '–';
  if(unit==='%')return (v*100).toFixed(2)+'%';
  if(unit==='$')return (v<0?'-':'')+'$'+Math.abs(v).toLocaleString(undefined,{maximumFractionDigits:0});
  if(unit==='x')return v.toFixed(2)+'x';
  return Math.abs(v)>=100?v.toFixed(0):v.toFixed(3);
}
function drawSeries(host,s){
  const box=document.createElement('div');box.className='chart';
  box.innerHTML='<div class="t">'+esc(s.label)+'</div><div class="u">'+esc(s.unit_label||'')+'</div>';
  const ys=(s.y instanceof Array)?{'':s.y}:s.y;const names=Object.keys(ys);
  if(names.length>1){box.innerHTML+='<div class="legend">'+names.map((n,k)=>'<span><i style="background:'+COLORS[k%COLORS.length]+'"></i>'+esc(n)+'</span>').join('')+'</div>'}
  const W=1000,H=230,pl=58,pr=12,pt=10,pb=28;
  const n=s.x.length;let all=[];names.forEach(k=>ys[k].forEach(v=>{if(v!=null)all.push(v)}));
  if(!all.length){host.appendChild(box);return}
  let lo=Math.min(...all),hi=Math.max(...all);if(s.kind==='bar'){lo=Math.min(0,lo);hi=Math.max(0,hi)}
  if(hi===lo){hi=lo+1}const pad=(hi-lo)*0.06;lo-=pad;hi+=pad;
  const X=i=>pl+(n>1?i/(n-1):0)*(W-pl-pr),Y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  let svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  const ticks=5;for(let t=0;t<=ticks;t++){const v=lo+(hi-lo)*t/ticks;const y=Y(v);svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#eceef1"/><text x="'+(pl-6)+'" y="'+(y+4)+'" font-size="11" text-anchor="end" fill="#6b7280">'+fmtNum(v,s.unit)+'</text>'}
  const xt=Math.min(6,n);for(let t=0;t<xt;t++){const i=Math.round(t*(n-1)/Math.max(1,xt-1));svg+='<text x="'+X(i)+'" y="'+(H-8)+'" font-size="11" text-anchor="'+(t===0?'start':t===xt-1?'end':'middle')+'" fill="#6b7280">'+esc(String(s.x[i]).slice(0,10))+'</text>'}
  if(lo<0&&hi>0){svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="#9ca3af" stroke-dasharray="3 3"/>'}
  names.forEach((k,ki)=>{const c=COLORS[ki%COLORS.length];const v=ys[k];
    if(s.kind==='bar'){const bw=Math.max(1,(W-pl-pr)/n*0.8/names.length);v.forEach((p,i)=>{if(p==null)return;const x=X(i)-bw*names.length/2+ki*bw;const y0=Y(0),y1=Y(p);svg+='<rect x="'+x+'" y="'+Math.min(y0,y1)+'" width="'+bw+'" height="'+Math.abs(y1-y0)+'" fill="'+(p<0?'#b91c1c':c)+'" opacity=".85"/>'})}
    else{let d='',pen=false;v.forEach((p,i)=>{if(p==null){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(p).toFixed(1);pen=true});svg+='<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="1.8" vector-effect="non-scaling-stroke"/>'}
  });
  svg+='<rect class="hit" x="'+pl+'" y="0" width="'+(W-pl-pr)+'" height="'+H+'" fill="transparent"/></svg>';
  box.innerHTML+=svg;host.appendChild(box);
  const hit=box.querySelector('.hit'),tt=$('#tt');
  hit.addEventListener('mousemove',e=>{const r=hit.getBoundingClientRect();const i=Math.round((e.clientX-r.left)/r.width*(n-1));
    tt.style.display='block';tt.style.left=(e.clientX+12)+'px';tt.style.top=(e.clientY+12)+'px';
    tt.innerHTML=esc(s.x[i])+'<br>'+names.map((k,ki)=>(k?esc(k)+': ':'')+fmtNum(ys[k][i],s.unit)).join('<br>')});
  hit.addEventListener('mouseleave',()=>tt.style.display='none');
}
function render(name){
  const sc=R.scenarios[name];
  document.querySelectorAll('#pills button').forEach(b=>b.classList.toggle('on',b.dataset.n===name));
  $('#scn-note').textContent=sc.note||'';
  const v=$('#verdict');v.textContent=sc.verdict||'';v.className='verdict '+(sc.verdict_tone||'neutral');
  $('#tiles').innerHTML=sc.tiles.map(t=>'<div class="tile '+(t.tone||'')+'"><div class="l">'+esc(t.label)+'</div><div class="v">'+esc(t.value)+'</div><div class="s">'+inline(t.sub||'')+'</div></div>').join('');
  const ch=$('#charts');ch.innerHTML='';(sc.series||[]).forEach(s=>drawSeries(ch,s));
  $('#tables').innerHTML=(sc.tables||[]).map(t=>'<h2>'+esc(t.title)+'</h2><div class="prose">'+md(t.md)+'</div>').join('');
  $('#notes').innerHTML=(sc.notes||[]).map(n=>'<li>'+inline(n)+'</li>').join('');
}
$('#title').textContent=R.title;$('#subtitle').textContent=R.subtitle||'';document.title=R.title;
const names=Object.keys(R.scenarios);
$('#pills').innerHTML=names.map(n=>'<button data-n="'+esc(n)+'">'+esc(R.scenarios[n].label||n)+'</button>').join('');
document.querySelectorAll('#pills button').forEach(b=>b.onclick=()=>render(b.dataset.n));
if(names.length<2)$('#scenario-row').style.display='none';
$('#sections').innerHTML=(R.sections||[]).map(s=>'<h2>'+esc(s.heading)+'</h2><div class="prose">'+md(s.body_md)+'</div>').join('');
$('#footer').textContent='Generated '+R.generated+' · results.json is written by backtest.py in this folder; the page is static and reproducible offline.';
render(R.default_scenario||names[0]);
</script>
