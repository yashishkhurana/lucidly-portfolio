ctions": [{"heading": "What this is", "body_md": "A WBTC-denominated vault that market-makes the WBTC/WETH 0.05% pool on Arbitrum with concentrated liquidity and hedges the WETH inventory the LP accumulates with a WETH loan on Aave v3 against WBTC collateral. 60% of equity sits in the LP band, 40% in the hedge leg. Benchmark is BTC; target is near-zero WETH delta; income is swap fees net of impermanent loss, rebalance slippage and borrow interest. I built the position maths, the hedge optimiser, the rebalance rules and the backtester; execution ran through pre-minted NFT tick bands and flashloan-levered Aave legs via the merkle-verified vault manager. This page is primarily an engine demonstration: the real window is one day and the longer runs are synthetic.\n\n```\namt0 = L\u00b7(1/\u221aP \u2212 1/\u221aPb)   amt1 = L\u00b7(\u221aP \u2212 \u221aPa)   V_LP(WBTC) = amt0 + amt1/P\nnet WETH delta = amt1 \u2212 D         LTV = (D/P) / collateral,  D_max = E_h \u00b7 LTV_max/(1\u2212LTV_max) \u00b7 P\n```"}, {"heading": "Hedge sizing", "body_md": "Debt D is chosen on [0, D_max] to minimise the worse of the two band-edge losses with a small asymmetry penalty:\n\n```\neq_edge(D) = V_LP(P_edge) + (E_h + D/P0) \u2212 D/P_edge\nobjective  = max(loss_low, loss_up) + 0.05\u00b7|loss_low \u2212 loss_up|\n```\nThis beats the naive `D = amt1` rule because the LP's WETH inventory is convex in price inside the band; the optimiser puts the hedge where the band edges are equally bad."}, {"heading": "Rebalance rules", "body_md": "| condition | action |\n|---|---|\n| price outside band (prod: oracle tick AND pool tick outside) | burn, swap surplus \u2192 deficit at oracle price with 10 bps min-out, re-seed next band with full LP equity, re-solve hedge |\n| LTV > 0.70 | repay debt to collateral \u00d7 0.60 \u00d7 P |\n| in range, hedge debt drift \u2265 50% of target (explainer: 20%) | re-solve hedge |\n| deposit / withdraw | split by current LP weight; scale L, collateral, debt pro rata |"}, {"heading": "What the engine shows", "body_md": "The band-width sweep is IL arithmetic against a linear fee assumption, so read it as a sensitivity, not a finding: narrow bands rotate constantly and pay IL + slippage every time, wide bands earn less per unit of liquidity but rotate rarely. What the real day says is narrower: over 25.7 hours ETH/BTC stayed inside a \u00b11.25% band, so there were no rotations and no realised IL. With fees measured from the pool's own Swap events the LP earned about five times what the modelled rate assumed (the pool was busy and our liquidity share in a tight band is large), which is enough to cover the hedge leg's seeding haircut and borrow on that day; with the modelled rate it was not. One day is one day \u2014 it does not change the sweep's conclusion about rotation costs. The production backtest on the same strategy (reference plot below, 1.07 days, five rotations) found fees 0.0207 BTC vs slippage 0.0326 + IL \u22480.066, net \u22120.086 BTC \u2014 the same conclusion, that rotation costs dominate on this pair. The hedge's job is the BTC-denominated curve. In these runs it lowers equity vol but not drawdown (tiles \u2014 the GBM drawdowns are IL-driven and the hedge cannot remove IL), and it does not pay for its own slippage and borrow."}, {"heading": "Reference plot \u2014 production backtest", "body_md": "![Hedged WBTC/WETH backtest, 10 spacing](../../data/hedged_wbtc_weth_backtest_10_spacing.png)\n\nFrom `github.com/lucidlylabs/simulations` (public). Panels: strategy AUM, price vs active range, fees vs IL + slippage, Aave LTV, net WETH exposure, fee wallet vs borrow cost, pool tick vs band."}, {"heading": "Reproduce", "body_md": "```\npython -m strategies.hedged_btc_mm.backtest\npytest tests/test_clmm.py\n```\n`common/clmm.py` = CL math (tested); `common/cl_engine.py` = the shared simulator; `strategy.py` = hedge optimiser and rules."}], "generated": "2026-10-23"};
