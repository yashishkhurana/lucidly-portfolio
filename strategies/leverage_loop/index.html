 "notes": ["Idle USDC modelled at 0%; collateral yield = trailing 3-day exchange-rate growth; borrow APR per daily sample; $25 gas per manage tx (lever, trim, de-lever, re-lever); siUSD wraps and unwinds are fee-free, as on-chain.", "Net-gate sustain = 2 daily samples (proxy for 6 hourly samples); re-enter after one sample above +50 bps.", "No collateral markdown occurred in the window, so the PARKED path is exercised only in the parametric tables below.", "Accrual uses the realised daily exchange-rate move at L\u00d7, not a smoothed yield, and the realised borrow APR per day: siUSD/USDC borrow printed 4\u201322% in this window, above the collateral yield on many days, which is why the levered rows earn less than the 1x hold.", "Market go-live respected: siUSD/USDC 2026-03-22 (first day its exchange rate moves) \u2014 no pre-live rates are used."]}}, "default_scenario": "8x", "sections": [{"heading": "What this is", "body_md": "A USDC vault running a leveraged stablecoin carry loop on Morpho Blue (Ethereum mainnet): wrap USDC into siUSD, supply it as collateral, borrow USDC against it and re-lever to a fixed target in one atomic Morpho flashloan. I owned the control design: sizing, leverage policy, the de-risking state machine, the caps and the backtests.\n\n```\nnet(L) = L*y - (L-1)*b = y + (L-1)*(y - b)      LTV = (L-1)/L\n```\nThe gate metric is the levered net at target leverage, never the raw spread: a loop is still net-positive with y < b while L*y > (L-1)*b."}, {"heading": "Allocation and sizing", "body_md": "- `score = net(L_target) / risk^beta` minus any entry-cost drag; a loop below the 25 bps lever margin scores 0 and is not levered.\n- The allocator is written for several loops (weights proportional to score, hard caps, spill-on-cap); on this single-market book it reduces to deploy-or-hold.\n- `cap_borrow = min(target_borrow, available_liquidity, 25% of market supply \u2212 our debt, $1M per tick)`; a capped leg shrinks and the idle waits (wait-not-spill).\n- 2% idle withdrawal buffer; an equity move fires only beyond max($50, 10% of target); leverage adjusts only beyond 5% drift of target.\n- Fixed per-market leverage, not an optimiser: a grid search over L returns the max corner in any positive-spread regime at ~29 RPC reads per loop per tick; the cases a dial would handle are covered by SAFETY, the net-gate and the markdown close."}, {"heading": "Risk framework", "body_md": "Three states, two decoupled triggers at different speeds:\n\n| transition | trigger | threshold | cadence |\n|---|---|---|---|\n| ACTIVE \u2192 UNLEVERED (1x, hold collateral) | levered net < 0, sustained | 6 consecutive hourly samples | hourly |\n| UNLEVERED \u2192 ACTIVE | net > +50 bps for 3 samples | \u2014 | hourly |\n| any \u2192 PARKED (exit to USDC) | exchange rate < HWM \u2212 1.5% | 2 consecutive 5-min ticks | 5 min |\n| SAFETY de-lever | LTV > max_ltv (0.890 at 8x) | back to 0.875; above 0.900 bypass gas budget | 5 min |\n\nA rate problem (negative spread) means de-lever and keep the yield asset; a principal problem (markdown) means exit regardless of carry.\n\n**Same-block markdown is the real liquidation control.** Morpho marks ERC4626 collateral at `convertToAssets`; a markdown m lifts LTV to LTV0/(1\u2212m), and no off-chain reaction beats a same-block move: `m* = 1 \u2212 LTV0/LLTV`.\n\n| leverage | operating LTV | same-block markdown that liquidates (LLTV 0.915) |\n|---|---|---|\n| 4x | 0.7500 | 18.03% |\n| 6x | 0.8333 | 8.93% |\n| 8x | 0.8750 | 4.37% |\n| 10x | 0.9000 | 1.64% |\n| 11x | 0.9091 | 0.65% |\n\n| markdown | equity P&L at 8x | liquidated |\n|---|---|---|\n| 0.50% | -4.00% | no |\n| 1.00% | -8.00% | no |\n| 2.00% | -16.00% | no |\n| 4.37% | -34.96% | no |\n| 5.00% | near-total loss | yes |\n| 8.00% | near-total loss | yes |\n\nUnprotected single-step band at the 1.5% close threshold: ~1.5%..4.37%. \"High leverage is only safe on collateral that cannot gap\" \u2014 the cushion under the collateral, not reaction speed, bounds this. What to watch: the same gate on a market with a volatile exchange rate (e.g. stcUSD) de-levers often and loses to entry fees; that market is not in this book.\n\n**Borrow-rate inversion.** Net zeroes when `b > L/(L\u22121) \u00b7 y` (1.143\u00b7y at 8x). siUSD/USDC borrow printed 21.65% at 100% utilisation on 2026-06-20 \u2014 the live inversion risk on this market, and the reason the net-gate exists.\n\n| collateral yield | borrow APR that zeroes net at 8x |\n|---|---|\n| 3% | 3.43% |\n| 4% | 4.57% |\n| 5% | 5.71% |\n| 6% | 6.86% |\n| 7% | 8.00% |"}, {"heading": "Leverage sweep and net-gate sensitivity", "body_md": "| leverage | 92d return | annualised | max DD | entry fees | de-levers |\n|---|---|---|---|---|---|\n| 8x | +0.85% | +3.39% | -0.19% | $0.00 | 4 |\n| 6x | +0.99% | +3.92% | -0.13% | $0.00 | 3 |\n| 3x | +1.18% | +4.68% | -0.04% | $0.00 | 0 |\n| 1x | +1.31% | +5.21% | 0.00% | $0.00 | 0 |\n\nNet-gate sensitivity at 8x: sustain 1 sample (hair-trigger) \u2192 +0.92%, 9 de-levers, $0.00 fees; sustain 2 \u2192 +0.85%, 4 de-levers.\n\nEvery row is positive. Leverage did not add in this window: the siUSD/USDC borrow rate ran above the collateral yield on many days, so each turn of leverage bought negative spread on those days and net-gate de-levers/re-levers (gas) on the rest, and realised return fell with leverage while drawdown rose. The rule I took from it: size leverage to the live spread, not to the LLTV."}, {"heading": "Adversarial review \u2014 top findings", "body_md": "- **Same-block markdown \u2192 liquidation (critical, accepted residual at 8x):** mitigated by the reactive 1.5% close and senior-tranche collateral; tightening options were lower per-market leverage (~4.5x), per-loop equity caps, or an oracle-push listener.\n- **Net-gate close was dead:** `spot_beats_idle = yield > 0` was always true for a yield-bearing stable, so the close branch could never fire. Rewritten as a sustained-negative-levered-net state machine.\n- **Allocator churn:** a $50 flat floor on a multi-100k book trimmed and re-levered every 15 min; fixed with a 10% weight deadband and an entry-cost gate (defer above 150 bps, never auto-enter above 400 bps).\n- **Strategist EOA out of gas \u2192 rebalance freeze:** with ~0.00021 ETH left every rebalance fails, and a SAFETY de-lever would fail with it. Added low-gas paging to the health job and preflight.\n- **Decoder missing a selector:** a leaf resolving in the merkle validator does not prove the deployed decoder supports it (`0xde42fa1c`). Rule: always run the anvil mainnet-fork E2E before trusting a new leaf. Three root regenerations came from this class of wiring bug.\n- **Oracle staleness unchecked** on markdown/swap-floor reads \u2014 flagged, listed to tighten."}, {"heading": "Operations", "body_md": "| job | cadence | does |\n|---|---|---|\n| snapshot | 5 min | per-loop collateral/debt/LTV, IRM borrow rate, oracle; persist samples; SAFETY; markdown close |\n| rebalance | 15 min | allocate + size + lever/unwind/adjust; dust sweep |\n| net_gate | 60 min | sustained-negative de-lever / re-arm |\n| withdraw | 5 min | free idle for pending redemptions, worst loop first (indexer-driven, fail-closed) |\n| health | 15 min | deposit-halt on share-price drop vs HWM, cron liveness watchdog, LTV page, low-gas warning, Discord |\n\nRead-only preflight validator (66 checks: every leaf against the live root, adapter binding, decoder constant, oracles, leverage feasibility vs LLTV, strategist role and gas), dry-run CLI, emergency exit, anvil fork E2E (lever/adjust/unwind, rebalance, SAFETY, net-gate, withdraw, health, concentration cap), Postgres state (snapshot, net history/state, actions, health, heartbeats), 26-panel Grafana dashboard, all-or-nothing env boot."}, {"heading": "Reproduce", "body_md": "```\npython -m strategies.leverage_loop.backtest\n```\n`strategy.py` holds the pure control logic (net APY, allocator with spill-on-cap, three-state gate, LTV bands, markdown and inver     const l=lines[i];

    if(l.startsWith('### ')){out+='<h3>'+inline(l.slice(4))+'</h3>';i++;continue}

      rows=rows.filter(r=>!/^\|\s*-/.test(r));out+='<table>'+rows.map((r,k)=>'<tr>'+r.split('|').slice(1,-1).map(c=>(k?'<td>':'<th>')+inline(c.trim())+(k?'</td>':'</th>')).join('')+'</tr>').join('')+'</table>';continue}
    if(/^\s*- /.test(l)){out+='<ul>';while(i<lines.length&&/^\s*- /.test(lines[i])){out+='<li>'+inline(lines[i].replace(/^\s*- /,''))+'</li>';i++}out+='</ul>';continue}

    out+='<p>'+inline(p)+'</p>';
  }
  return out;
}
