9", "2026-04-20", "2026-04-21", "2026-04-22", "2026-04-23", "2026-04-24", "2026-04-25", "2026-04-26", "2026-04-27", "2026-04-28", "2026-04-29", "2026-04-30", "2026-05-01", "2026-05-02", "2026-05-03", "2026-05-04", "2026-05-05", "2026-05-06", "2026-05-07", "2026-05-08", "2026-05-09", "2026-05-10", "2026-05-11", "2026-05-12", "2026-05-13", "2026-05-14", "2026-05-15", "2026-05-16", "2026-05-17", "2026-05-18", "2026-05-19", "2026-05-20", "2026-05-21", "2026-05-22", "2026-05-23", "2026-05-24", "2026-05-25", "2026-05-26", "2026-05-27", "2026-05-28", "2026-05-29", "2026-05-30", "2026-05-31", "2026-06-01", "2026-06-02", "2026-06-03", "2026-06-04", "2026-06-05", "2026-06-06", "2026-06-07", "2026-06-08", "2026-06-09", "2026-06-10", "2026-06-11", "2026-06-12", "2026-06-13", "2026-06-14", "2026-06-15", "2026-06-16", "2026-06-17", "2026-06-18", "2026-06-19", "2026-06-20", "2026-06-21", "2026-06-22"], "y": [1000000.0, 1000000.0, 1000000.0, 19975.0, 19975.0, 19975.0, 19975.0, 19975.0, 19975.0, 19975.0, 19975.0, 19975.0, 19950.0, 19950.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19925.0, 19900.0, 19875.0, 19875.0, 19875.0, 19875.0, 20138.62043, 20138.62043, 20113.62043, 20113.62043, 20088.62043, 20088.62043, 20088.62043, 20088.62043, 20088.62043, 20088.62043, 20063.62043, 20038.62043, 20038.62043, 20038.62043, 20038.62043, 20038.62043, 20038.62043, 20038.62043], "kind": "line", "unit": "$"}], "tables": [{"title": "Final allocation", "md": "| loop | equity | state | levered net (last) |\n|---|---|---|---|\n| stcusd | $691.8k | ACTIVE | +4.42% |\n| siusd | $198.6k | ACTIVE | +5.95% |\n| usd3 | $98.6k | ACTIVE | +7.34% |"}], "notes": ["Idle USDC modelled at 0%; collateral yield = trailing 3-day exchange-rate growth; borrow APR per daily sample; $25 gas per manage tx (lever, trim, de-lever, re-lever); Cap mint fee on stcUSD levers only \u2014 USDC-loop wraps and all unwinds are fee-free, as on-chain.", "Net-gate sustain = 2 daily samples (proxy for 6 hourly samples); re-enter after one sample above +50 bps.", "No collateral markdown occurred in the window, so the PARKED path is exercised only in the parametric tables below.", "Accrual uses the realised daily exchange-rate move at L\u00d7 (15 small down-days in stcUSD cost 8\u00d7 each), not a smoothed yield; the internal Lucidly sim on smoothed yields showed +0.30% at 8x and +1.32% at 1x over the same window \u2014 same ordering, more flattering level.", "Market go-live dates respected: siUSD and stcUSD 2026-03-22, USD3 2026-06-03 (first day its exchange rate moves) \u2014 no pre-live rates are used."]}}, "default_scenario": "8x", "sections": [{"heading": "What this is", "body_md": "A USDC vault running a portfolio of leveraged stablecoin carry loops on Morpho Blue (Ethereum mainnet). Each loop wraps USDC into a yield-bearing stable (stcUSD, siUSD, USD3), supplies it as collateral, borrows the loan token (USDT for stcUSD via an oracle-floored DEX leg inside the flashloan, USDC otherwise) and re-levers to a fixed per-market target in one atomic Morpho flashloan. I owned the control design: allocation, leverage policy, the de-risking state machine, the sizing caps and the backtests. Live from June 2026 on mainnet with three markets.\n\n```\nnet(L) = L*y - (L-1)*b = y + (L-1)*(y - b)      LTV = (L-1)/L\n```\nThe gate metric is the levered net at target leverage, never the raw spread: a loop is still net-positive with y < b while L*y > (L-1)*b."}, {"heading": "Allocation and sizing", "body_md": "- `score_i = net_i(L_target) / risk_i^beta` minus an entry-cost drag (1%/yr for stcUSD); a loop below the 25 bps lever margin scores 0.\n- Weights proportional to score, clamped to hard caps (stcUSD 1.0 / siUSD 0.20 / USD3 0.10), freed mass renormalised onto the others (spill-on-cap).\n- `cap_borrow = min(target_borrow, available_liquidity, 25% of market supply \u2212 our debt, $1M per tick)`; a capped leg shrinks and the idle waits (wait-not-spill).\n- 2% idle withdrawal buffer; an equity move fires only beyond max($50, 10% of target); leverage adjusts only beyond 5% drift of target.\n- Fixed per-market leverage, not an optimiser: a grid search over L returns the max corner in any positive-spread regime at ~29 RPC reads per loop per tick; the cases a dial would handle are covered by SAFETY, the net-gate and the markdown close."}, {"heading": "Risk framework", "body_md": "Three states, two decoupled triggers at different speeds:\n\n| transition | trigger | threshold | cadence |\n|---|---|---|---|\n| ACTIVE \u2192 UNLEVERED (1x, hold collateral) | levered net < 0, sustained | 6 consecutive hourly samples | hourly |\n| UNLEVERED \u2192 ACTIVE | net > +50 bps for 3 samples | \u2014 | hourly |\n| any \u2192 PARKED (exit to USDC) | exchange rate < HWM \u2212 1.5% | 2 consecutive 5-min ticks | 5 min |\n| SAFETY de-lever | LTV > max_ltv (0.890 at 8x) | back to 0.875; above 0.900 bypass gas budget | 5 min |\n\nA rate problem (negative spread) means de-lever and keep the yield asset; a principal problem (markdown) means exit regardless of carry.\n\n**Same-block markdown is the real liquidation control.** Morpho marks ERC4626 collateral at `convertToAssets`; a markdown m lifts LTV to LTV0/(1\u2212m), and no off-chain reaction beats a same-block move: `m* = 1 \u2212 LTV0/LLTV`.\n\n| leverage | operating LTV | same-block markdown that liquidates (LLTV 0.915) |\n|---|---|---|\n| 4x | 0.7500 | 18.03% |\n| 6x | 0.8333 | 8.93% |\n| 8x | 0.8750 | 4.37% |\n| 10x | 0.9000 | 1.64% |\n| 11x | 0.9091 | 0.65% |\n\n| markdown | equity P&L at 8x | liquidated |\n|---|---|---|\n| 0.50% | -4.00% | no |\n| 1.00% | -8.00% | no |\n| 2.00% | -16.00% | no |\n| 4.37% | -34.96% | no |\n| 5.00% | near-total loss | yes |\n| 8.00% | near-total loss | yes |\n\nUnprotected single-step band at the 1.5% close threshold: ~1.5%..4.37%. \"High leverage is only safe on collateral that cannot gap\" \u2014 the junior cushion under each senior-tranche collateral, not reaction speed, bounds this.\n\n**Borrow-rate inversion.** Net zeroes when `b > L/(L\u22121) \u00b7 y` (1.143\u00b7y at 8x). siUSD/USDC borrow printed 21.65% at 100% utilisation on 2026-06-20 \u2014 the live inversion risk, and why siUSD is hard-capped at 0.20.\n\n| collateral yield | borrow APR that zeroes net at 8x |\n|---|---|\n| 3% | 3.43% |\n| 4% | 4.57% |\n| 5% | 5.71% |\n| 6% | 6.86% |\n| 7% | 8.00% |"}, {"heading": "Leverage sweep and net-gate sensitivity", "body_md": "| leverage | 92d return | annualised | max DD | entry fees | de-levers |\n|---|---|---|---|---|---|\n| 8x | -1.39% | -5.51% | -2.57% | $26.3k | 10 |\n| 6x | -0.88% | -3.51% | -1.91% | $20.7k | 9 |\n| 3x | 0.00% | 0.00% | -0.92% | $9.7k | 6 |\n| 1x | +0.91% | +3.60% | -0.09% | $3.7k | 4 |\n\nNet-gate sensitivity at 8x: sustain 1 sample (hair-trigger) \u2192 -5.53%, 26 de-levers, $58.7k fees; sustain 2 \u2192 -1.39%, 10 de-levers.\n\nIn this window the in-sample spread (y \u2212 b) was only ~+0.3%: each turn of leverage added ~0.3% of gross carry but induced more than that in net-gate churn (~70 bps per stcUSD de-lever/re-lever round-trip, Cap mint fee \u00d7 leverage) plus tail risk, so realised return fell monotonically with leverage while drawdown rose. The conclusion I took into production: size leverage to the live spread, and make the net-gate cost-aware (longer sustain for entry-fee markets)."}, {"heading": "Adversarial review \u2014 top findings", "body_md": "- **Same-block markdown \u2192 liquidation (critical, accepted residual at 8x):** mitigated by the reactive 1.5% close and senior-tranche collateral; tightening options were lower per-market leverage (~4.5x), per-loop equity caps, or an oracle-push listener.\n- **Net-gate close was dead:** `spot_beats_idle = yield > 0` was always true for a yield-bearing stable, so the close branch could never fire. Rewritten as a sustained-negative-levered-net state machine.\n- **Allocator churn re-paying the mint fee:** a $50 flat floor on a multi-100k book trimmed and re-levered every 15 min; fixed with a 10% weight deadband and an entry-cost gate (defer above 150 bps, never auto-enter above 400 bps).\n- **Strategist EOA out of gas \u2192 trading freeze (2026-06-22):** ~0.00021 ETH left, every rebalance failed for >1h; a SAFETY de-lever would also have failed. Added low-gas paging to the health job and preflight.\n- **Decoder missing a selector:** a leaf resolving in the merkle validator does not prove the deployed decoder supports it (`0xde42fa1c`); the stcUSD Cap path hit this. Rule: always run the anvil mainnet-fork E2E before trusting a new leaf. Three root regenerations came from this class of wiring bug.\n- **Depeg-stuck exit on the USDT bridge:** beyond the 30 bps Chainlink floor the swap leg defers, so the largest book can hold but not adjust; accepted, residue swept and counted in NAV.\n- **Oracle staleness unchecked** on markdown/swap-floor reads \u2014 flagged, listed to tighten."}, {"heading": "Operations", "body_md": "| job | cadence | does |\n|---|---|---|\n| snapshot | 5 min | per-loop collateral/debt/LTV, IRM borrow rate, oracle; persist samples; SAFETY; markdown close |\n| rebalance | 15 min | allocate + size + lever/unwind/adjust; dust sweep |\n| net_gate | 60 min | sustained-negative de-lever / re-arm |\n| withdraw | 5 min | free idle for pending redemptions, worst loop first (indexer-driven, fail-closed) |\n| health | 15 min | deposit-halt on share-price drop vs HWM, cron liveness watchdog, LTV page, low-gas warning, Discord |\n| loan_token_sweep | hourly | swap USDT residue > $50 back to USD const COLORS=['#4f46e5','#0f766e','#b45309','#be185d','#475569','#0369a1','#65a30d'];
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')}
function md(src){
  const lines=src.split('\n');let out='',i=0;
  while(i<lines.length){
    const l=lines[i];
    if(l.startsWith('```')){let b='';i++;while(i<lines.length&&!lines[i].startsWith('```')){b+=lines[i]+'\n';i++}i++;out+='<pre>'+esc(b)+'</pre>';continue}
    if(l.startsWith('### ')){out+='<h3>'+inline(l.slice(4))+'</h3>';i++;continue}
    if(l.startsWith('## ')){out+='<h3>'+inline(l.slice(3))+'</h3>';i++;continue}
    if(l.startsWith('|')){let rows=[];while(i<lines.length&&lines[i].startsWith('|')){rows.push(lines[i]);i++}
      rows=rows.filter(r=>!/^\|\s*-/.test(r));out+='<table>'+rows.map((r,k)=>'<tr>'+r.split('|').slice(1,-1).map(c=>(k?'<td>':'<th>')+inline(c.trim())+(k?'</td>':'</th>')).join('')+'</tr>').join('')+'</table>';continue}
    if(/^\s*- /.test(l)){out+='<ul>';while(i<lines.length&&/^\s*- /.test(lines[i])){out+='<li>'+inline(lines[i].replace(/^\s*- /,''))+'</li>';i++}out+='</ul>';continue}
    if(l.trim()===''){i++;continue}
    let p=l;i++;while(i<lines.length&&lines[i].trim()!==''&&!/^(#|\||```|\s*- )/.test(lines[i])){p+=' '+lines[i];i++}
    out+='<p>'+inline(p)+'</p>';
  }
  return out;
}
function fmtNum(v,unit){
  if(v==null)return '–';
  if(unit==='%')return (v*100).toFixed(2)+'%';
  if(unit==='$')return (v<0?'-':'')+'$'+Math.abs(v).toLocaleString(undefined,{maximumFractionDigits:0});
  if(unit==='x')return v.toFixed(2)+'x';
  return Math.abs(v)>=100?v.toFixed(0):v.toFixed(3);
}
function drawSeries(host,s){
  const box=document.createElement('div');box.className='chart';
  box.innerHTML='<div class="t">'+esc(s.label)+'</div><div class="u">'+esc(s.unit_label||'')+'</div>';
  const ys=(s.y instanceof Array)?{'':s.y}:s.y;const names=Object.keys(ys);
  if(names.length>1){box.innerHTML+='<div class="legend">'+names.map((n,k)=>'<span><i style="background:'+COLORS[k%COLORS.length]+'"></i>'+esc(n)+'</span>').join('')+'</div>'}
  const W=1000,H=230,pl=58,pr=12,pt=10,pb=28;
  const n=s.x.length;let all=[];names.forEach(k=>ys[k].forEach(v=>{if(v!=null)all.push(v)}));
  if(!all.length){host.appendChild(box);return}
  let lo=Math.min(...all),hi=Math.max(...all);if(s.kind==='bar'){lo=Math.min(0,lo);hi=Math.max(0,hi)}
  if(hi===lo){hi=lo+1}const pad=(hi-lo)*0.06;lo-=pad;hi+=pad;
  const X=i=>pl+(n>1?i/(n-1):0)*(W-pl-pr),Y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  let svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  const ticks=5;for(let t=0;t<=ticks;t++){const v=lo+(hi-lo)*t/ticks;const y=Y(v);svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#eceef1"/><text x="'+(pl-6)+'" y="'+(y+4)+'" font-size="11" text-anchor="end" fill="#6b7280">'+fmtNum(v,s.unit)+'</text>'}
  const xt=Math.min(6,n);for(let t=0;t<xt;t++){const i=Math.round(t*(n-1)/Math.max(1,xt-1));svg+='<text x="'+X(i)+'" y="'+(H-8)+'" font-size="11" text-anchor="'+(t===0?'start':t===xt-1?'end':'middle')+'" fill="#6b7280">'+esc(String(s.x[i]).slice(0,10))+'</text>'}
  if(lo<0&&hi>0){svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="#9ca3af" stroke-dasharray="3 3"/>'}
  names.forEach((k,ki)=>{const c=COLORS[ki%COLORS.length];const v=ys[k];
    if(s.kind==='bar'){const bw=Math.max(1,(W-pl-pr)/n*0.8/names.length);v.forEach((p,i)=>{if(p==null)return;const x=X(i)-bw*names.length/2+ki*bw;const y0=Y(0),y1=Y(p);svg+='<rect x="'+x+'" y="'+Math.min(y0,y1)+'" width="'+bw+'" height="'+Math.abs(y1-y0)+'" fill="'+(p<0?'#b91c1c':c)+'" opacity=".85"/>'})}
    else{let d='',pen=false;v.forEach((p,i)=>{if(p==null){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(p).toFixed(1);pen=true});svg+='<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="1.8" vector-effect="non-scaling-stroke"/>'}
  });
  svg+='<rect class="hit" x="'+pl+'" y="0" width="'+(W-pl-pr)+'" height="'+H+'" fill="transparent"/></svg>';
  box.innerHTML+=svg;host.appendChild(box);
  const hit=box.querySelector('.hit'),tt=$('#tt');
  hit.addEventListener('mousemove',e=>{const r=hit.getBoundingClientRect();const i=Math.round((e.clientX-r.left)/r.width*(n-1));
    tt.style.display='block';tt.style.left=(e.clientX+12)+'px';tt.style.top=(e.clientY+12)+'px';
    tt.innerHTML=esc(s.x[i])+'<br>'+names.map((k,ki)=>(k?esc(k)+': ':'')+fmtNum(ys[k][i],s.unit)).join('<br>')});
  hit.addEventListener('mouseleave',()=>tt.style.display='none');
}

$('#title').textContent=R.title;$('#subtitle').textContent=R.subtitle||'';document.title=R.title;
const names=Object.keys(R.scenarios);
$('#pills').innerHTML=names.map(n=>'<button data-n="'+esc(n)+'">'+esc(R.scenarios[n].label||n)+'</button>').join('');

$('#sections').innerHTML=(R.sections||[]).map(s=>'<h2>'+esc(s.heading)+'</h2><div class="prose">'+md(s.body_md)+'</div>').join('');

</script>
