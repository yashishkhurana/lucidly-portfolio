.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:4px 0 6px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.prose{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:12px 0}

.prose th,.prose td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.prose th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

.notes{font-size:12.5px;color:var(--muted)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

footer{margin-top:40px;font-size:11.5px;color:var(--muted)}
.tooltip{position:fixed;pointer-events:none;background:#14161a;color:#fff;font-size:11px;padding:4px 7px;border-radius:5px;display:none;z-index:9}

4.5376, 601794.5376, 601794.5376, 601794.5376, 601794.5376, 601794.5376, 601794.5376, 601794.5376, 601794.5376, 601794.5376, 601794.5376, 601794.5376, 601794.5376, 601794.5376, 601794.5376, 406560.4169, 335789.0364, 310956.1462, 126190.6283, 246178.2793, 251419.8537, 451179.1727, 413803.1343, 316026.6021, 439492.1366, 692650.5516, 504823.1696], "kind": "line", "unit": "$"}], "notes": ["Supply-side strategy: the loss path is bad debt / oracle failure, not price; the gates (utilisation cap, oracle staleness, hurdle hysteresis, concentration) are the whole risk model.", "Roughly half the book sat idle at 0% for the whole window: with three markets whose window-mean APY hovers around the 3\u20134% hurdles and hard 0.40 weight caps, the hurdle hysteresis and caps bind, not the per-tick deploy caps (the 10\u00d7 scenario moves deployment by ~1 point). In the full design a fallback market (cbBTC/USDC) absorbs the remainder; here there is none, so the idle drag is shown rather than hidden.", "The quadratic term is inert at this window length: with a 4-sample APY window the covariance is ~1e-5 and \u03bb = 1, so the penalty is ~1e-6 against a linear term of ~0.05 and SLSQP returns the greedy fill under caps. The same was true of the 6 h production window. The risk control is the haircut, the caps and the gates \u2014 the solver is there for the day a longer window is used."]}}, "default_scenario": "prod", "sections": [{"heading": "What this is", "body_md": "Two supply-side USDC clusters I designed and built: (1) a Morpho Blue lending cluster that spreads a vault's idle USDC across curated markets with a mean-variance allocator, hard eligibility gates and a planner that turns weight deltas into supply/withdraw calls from the vault; (2) a junior-tranche cluster on Royco Dawn markets with 24-hour asynchronous redemptions, a wrap \u2192 finalize \u2192 execute deposit pipeline and a repair pipeline for orphaned on-chain requests. The junior book's risk rule \u2014 a tranche's depeg leverage (1/junior share) priced against its underlying's volatility before allocation, so a thin cushion on a moving underlying is excluded by score \u2014 is in `strategy.py` with tests; no Royco tranche series is bundled, so it has no scenario on this page.\n\n```\nsupply_apy = borrow_apr \u00d7 utilisation \u00d7 (1 \u2212 fee)\nmax  mu_adj'w \u2212 (\u03bb/2) w'\u03a3w     mu_adj = mu \u2212 50 bps \u00d7 max(0, risk \u2212 3)\ns.t. 0 \u2264 w \u2264 min(max_weight, capacity/portfolio),  \u03a3w = min(1, \u03a3 upper)\ncapacity = min(abs_cap, concentration_cap \u00d7 market_borrows)\n```"}, {"heading": "Eligibility and exits", "body_md": "| gate | rule |\n|---|---|\n| oracle health | \u2265 2 observations in window, heartbeat-aware staleness per feed (BTC/USD 2 h, mF-ONE 5 d), else zero capacity |\n| utilisation | > 0.95 \u2192 excluded; health job trims supplied markets above 0.95 while liquidity exists |\n| hurdle hysteresis | 6 h-mean APY below hurdle for 3 consecutive ticks (18 h) \u2192 no new allocation |\n| exit band | existing position tolerated to hurdle \u2212 50 bps; below for 3 ticks \u2192 exit |\n| deposit depth | a deposit may lower utilisation by \u2264 100 bps: `max_dep = borrow/(util \u2212 0.01) \u2212 supply` |\n| drift gate | no rebalance unless total drift \u2265 1% of portfolio; per-leg floor 1,000 USDC |\n| withdrawals | reserve = pending queue demand + 50 bps, 1 h floor, subgraph \u2264 50 blocks behind; withdraw \u2264 80% of visible liquidity per market, worst market first |\n\nHurdle checks run on the window mean, not the instantaneous print \u2014 the same hysteresis idea as the loop cluster's net-gate."}, {"heading": "Review findings", "body_md": "- Lending cluster readiness review: 13 findings (P0\u2013P2) \u2014 receipt-status handling, 300 s receipt timeout, nonce lock across build + send, equality constraint when the upper bounds don't sum to 1, fail-safe when the market-data source is fully down. Suite 88 \u2192 100+ tests
